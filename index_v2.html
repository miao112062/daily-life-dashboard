<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎀 每日生活管理 · Hello Kitty</title>
  <meta http-equiv="Cache-Control" content="no-store">
  <style>
  :root {
    --bg: #fff0f5;
    --card-bg: #ffffff;
    --text: #5c3344;
    --text-light: #b08498;
    --accent: #f4a0b8;
    --accent-dark: #e87890;
    --accent-light: #ffe0ea;
    --pink-deep: #e75480;
    --pink-red: #d6336c;
    --income: #66b37a;
    --expense: #e75480;
    --border: #fddde6;
    --shadow: 0 2px 16px rgba(231,84,128,0.08);
    --radius: 20px;
    --sidebar-w: 220px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: var(--sidebar-w);
    background: #fff;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 24px rgba(231,84,128,0.08);
    z-index: 100;
    padding: 28px 0;
    border-right: 3px solid #ffe0ea;
  }
  .sidebar-logo {
    padding: 0 24px 28px;
    font-size: 17px;
    font-weight: 700;
    color: var(--pink-deep);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sidebar-logo .sidebar-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffe0ea, #f4a0b8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(231,84,128,0.2);
  }
  .sidebar-logo .sidebar-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #sidebarNickname {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 120px;
  }
  .sidebar-nav {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 12px;
  }
  .sidebar-nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 12px;
    text-decoration: none;
    color: var(--text-light);
    font-size: 14.5px;
    transition: all 0.2s;
    cursor: pointer;
  }
  .sidebar-nav a:hover {
    background: #fff0f5;
    color: var(--pink-deep);
  }
  .sidebar-nav a.active {
    background: #ffe0ea;
    color: var(--pink-deep);
    font-weight: 600;
  }
  .sidebar-nav a .nav-emoji { font-size: 18px; width: 24px; text-align: center; }
  .sidebar-footer {
    padding: 16px 24px 0;
    font-size: 12px;
    color: #f0a8c0;
    text-align: center;
  }

  /* ===== MAIN ===== */
  .main {
    margin-left: var(--sidebar-w);
    flex: 1;
    padding: 32px 36px;
    min-height: 100vh;
  }

  /* ===== DATE BAR ===== */
  .date-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    padding: 12px 20px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .date-bar .date-label { font-weight: 600; color: var(--text-light); font-size: 13px; }
  .date-bar input[type="date"] {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    background: #fff5f8;
    font-family: inherit;
  }
  .date-bar input[type="date"]:focus { border-color: var(--accent); }
  .date-bar .btn-today {
    background: linear-gradient(135deg, #f4a0b8, #e87890);
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .date-bar .btn-today:hover { background: linear-gradient(135deg, #e87890, #d6336c); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(231,84,128,0.25); }
  .date-bar .current-display { margin-left: auto; font-size: 14px; color: var(--text); font-weight: 600; }

  /* ===== CONTENT PANELS ===== */
  .panel { display: none; }
  .panel.active { display: block; }

  .module-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--pink-deep);
  }

  /* Cards */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card h3 {
    font-size: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--pink-deep);
  }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }

  /* Meal cards */
  .meal-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--accent);
  }
  .meal-card.breakfast { border-left-color: #ffb3c6; }
  .meal-card.lunch { border-left-color: #ff8fab; }
  .meal-card.dinner { border-left-color: #ffc2d1; }
  .meal-card h3 {
    font-size: 18px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .meal-card .meal-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .meal-card .meal-cal {
    display: inline-block;
    background: linear-gradient(135deg, #fff0f5, #ffe0ea);
    color: var(--pink-deep);
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .calorie-summary {
    background: linear-gradient(135deg, #fff5f8, #ffe8ee);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .calorie-summary .cal-total {
    text-align: center;
    min-width: 90px;
  }
  .calorie-summary .cal-total .cal-num {
    font-size: 32px;
    font-weight: 800;
    color: var(--pink-deep);
    line-height: 1;
  }
  .calorie-summary .cal-total .cal-label {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 4px;
  }
  .calorie-summary .cal-divider {
    width: 1px; height: 40px;
    background: linear-gradient(to bottom, transparent, #f4a0b8, transparent);
  }
  .calorie-summary .cal-breakdown {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .calorie-summary .cal-item {
    text-align: center;
    min-width: 60px;
  }
  .calorie-summary .cal-item .cal-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }
  .calorie-summary .cal-item .cal-dot.bk { background: #ffb3c6; }
  .calorie-summary .cal-item .cal-dot.lu { background: #ff8fab; }
  .calorie-summary .cal-item .cal-dot.dn { background: #ffc2d1; }
  .calorie-summary .cal-item .cal-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .calorie-summary .cal-item .cal-tag {
    font-size: 11px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .meal-card .steps { font-size: 13px; line-height: 1.8; color: var(--text); }
  .meal-card .steps li { margin-bottom: 4px; }
  .meal-card .ingredients {
    background: #fff5f8;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--text-light);
  }

  /* Skincare */
  .skincare-section {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .skincare-section h3 {
    font-size: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .checklist-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    font-size: 14px;
    border-bottom: 1px dashed var(--border);
  }
  .checklist-item:last-child { border-bottom: none; }
  .checklist-item .check-box {
    width: 20px; height: 20px;
    border: 2px solid var(--accent);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .checklist-item .check-box.checked {
    background: var(--accent);
    color: #fff;
    font-size: 12px;
  }
  .tip-badge {
    display: inline-block;
    background: #ffe0ea;
    color: #d6336c;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin: 4px 4px 4px 0;
  }

  /* Workout daily */
  .workout-cal-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 18px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .workout-cal-card .cal-block { display: flex; flex-direction: column; }
  .workout-cal-card .cal-label {
    font-size: 12px;
    color: #c4a0ae;
    font-weight: 500;
  }
  .workout-cal-card .cal-value {
    font-size: 34px;
    font-weight: 800;
    color: #d4687c;
    line-height: 1.1;
  }
  .workout-cal-card .cal-divider {
    width: 1px; height: 40px;
    background: #f0dce2;
    border-radius: 1px;
    flex-shrink: 0;
  }
  .workout-cal-card .cal-progress {
    flex: 1;
    min-width: 150px;
  }
  .workout-cal-card .cal-progress-text {
    font-size: 13px;
    color: #9e7d87;
    line-height: 1.6;
  }
  .workout-cal-card .cal-progress-bar {
    height: 5px;
    background: #f5e8ec;
    border-radius: 3px;
    margin-top: 6px;
    overflow: hidden;
  }
  .workout-cal-card .cal-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #eeb0be, #d4687c);
    border-radius: 3px;
    transition: width 0.3s;
  }
  .workout-cal-card .cal-badge {
    background: #fef5f7;
    color: #d4687c;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .workout-day-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .workout-day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px dashed var(--border);
  }
  .workout-day-header h3 { font-size: 16px; }
  .workout-day-header .day-status { font-size: 13px; color: var(--text-light); }
  .workout-day-header .day-status.done { color: var(--pink-deep); font-weight: 600; }
  .rest-placeholder {
    text-align: center;
    padding: 24px;
    color: var(--text-light);
    font-size: 13px;
    background: #fff8fa;
    border-radius: 14px;
    margin-bottom: 12px;
  }
  .ex-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px dashed var(--border);
  }
  .ex-item:last-child { border-bottom: none; }
  .ex-item input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: var(--pink-deep);
    cursor: pointer;
    flex-shrink: 0;
  }
  .ex-item .ex-info { flex: 1; }
  .ex-item .ex-info.done { text-decoration: line-through; opacity: 0.6; }
  .ex-item .ex-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  .ex-item .ex-meta { font-size: 12px; color: var(--text-light); }
  .ex-item .ex-cal { font-size: 12px; color: var(--pink-deep); font-weight: 600; }
  .ex-item .btn-del-ex {
    background: none; border: none; color: #d6336c;
    cursor: pointer; font-size: 16px; padding: 4px 8px;
    border-radius: 6px; transition: all 0.2s;
  }
  .ex-item .btn-del-ex:hover { background: #ffe0ea; }
  .day-actions {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .day-actions button {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--pink-deep);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .day-actions button:hover { background: #fff0f5; }
  .day-actions button.primary { background: var(--pink-deep); color: #fff; border-color: var(--pink-deep); }
  .day-actions button.primary:hover { background: #d6336c; }
  .add-ex-form {
    background: #fff8fa;
    border-radius: 14px;
    padding: 14px;
    margin-top: 12px;
    display: none;
  }
  .add-ex-form.active { display: block; }
  .add-ex-form input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 13px;
    background: #fff;
  }
  .add-ex-form input:focus { outline: none; border-color: var(--pink-deep); }
  .add-ex-form .form-row { display: flex; gap: 10px; }
  .add-ex-form .form-row input { flex: 1; margin-bottom: 0; }
  .add-ex-form .form-actions {
    display: flex; gap: 10px; margin-top: 12px;
  }
  .add-ex-form .form-actions button {
    flex: 1; padding: 8px; border-radius: 10px; border: none;
    cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .add-ex-form .form-actions .btn-confirm { background: var(--pink-deep); color: #fff; }
  .add-ex-form .form-actions .btn-cancel { background: #fff; border: 1px solid var(--border); color: var(--text); }

  /* Profile */
  .profile-header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 28px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .profile-avatar-wrap {
    position: relative;
    width: 88px; height: 88px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    cursor: pointer;
    background: #ffe0ea;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  .profile-avatar-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .profile-avatar-wrap .avatar-hover {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: 50%;
  }
  .profile-avatar-wrap:hover .avatar-hover { opacity: 1; }
  .profile-info { flex: 1; }
  .profile-info .profile-nickname {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
    cursor: pointer;
  }
  .profile-info .profile-nickname:hover { color: var(--pink-deep); }
  .profile-info .profile-sign {
    font-size: 13px;
    color: var(--text-light);
  }
  .profile-info .btn-edit-profile {
    margin-top: 10px;
    background: linear-gradient(135deg, #f4a0b8, #e87890);
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .profile-info .btn-edit-profile:hover { background: linear-gradient(135deg, #e87890, #d6336c); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(231,84,128,0.25); }
  .body-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }
  .body-stat-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 18px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .body-stat-card .stat-emoji { font-size: 24px; margin-bottom: 6px; }
  .body-stat-card .stat-label { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
  .body-stat-card .stat-value { font-size: 20px; font-weight: 700; color: var(--text); }
  .body-stat-card .stat-unit { font-size: 12px; color: var(--text-light); }
  .stat-history {
    margin-top: 20px;
  }
  .stat-history .stat-record {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: #fff5f8;
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .stat-record .record-date { color: var(--text-light); }
  .stat-record .record-values { color: var(--text); font-weight: 600; }

  /* Finance */
  .finance-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .fin-sum-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px 18px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .fin-sum-card .fin-label { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
  .fin-sum-card .fin-value { font-size: 22px; font-weight: 700; }
  .fin-sum-card.income .fin-value { color: var(--income); }
  .fin-sum-card.expense .fin-value { color: var(--expense); }
  .fin-sum-card.balance .fin-value { color: var(--text); }

  .fin-form {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-wrap: wrap;
    padding: 20px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .fin-form .form-group { display: flex; flex-direction: column; gap: 4px; }
  .fin-form label { font-size: 12px; color: var(--text-light); font-weight: 600; }
  .fin-form select, .fin-form input {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    background: #fff5f8;
    font-family: inherit;
  }
  .fin-form select:focus, .fin-form input:focus { border-color: var(--accent); }
  .fin-form .btn-add {
    background: linear-gradient(135deg, #f4a0b8, #e87890);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .fin-form .btn-add:hover { background: linear-gradient(135deg, #e87890, #d6336c); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(231,84,128,0.25); }

  .fin-entry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: #fff;
    border-radius: 12px;
    margin-bottom: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    font-size: 14px;
  }
  .fin-entry .entry-cat { font-size: 18px; width: 28px; text-align: center; flex-shrink: 0; }
  .fin-entry .entry-info { flex: 1; }
  .fin-entry .entry-name { font-weight: 600; }
  .fin-entry .entry-note { font-size: 12px; color: var(--text-light); }
  .fin-entry .entry-amount { font-weight: 700; font-size: 16px; }
  .fin-entry.income .entry-amount { color: var(--income); }
  .fin-entry.expense .entry-amount { color: var(--expense); }
  .fin-entry .entry-actions { display: flex; gap: 6px; }
  .fin-entry .btn-edit, .fin-entry .btn-del {
    background: none; border: none; cursor: pointer;
    font-size: 16px; padding: 4px 6px; border-radius: 6px;
    transition: all 0.2s;
  }
  .fin-entry .btn-edit:hover { background: #ffe0ea; }
  .fin-entry .btn-del:hover { background: #ffd6e0; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 14px;
  }
  .empty-state .empty-emoji { font-size: 48px; margin-bottom: 12px; }

  /* Modal */
  .modal-overlay {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .modal {
    background: #fff;
    border-radius: var(--radius);
    padding: 28px;
    width: 380px;
    max-width: 90vw;

<script>
// ==================== DATA ENGINE ====================
const today = new Date();
let currentDate = { diet: formatDate(today), skincare: formatDate(today), workout: formatDate(today), finance: formatDate(today), profile: formatDate(today) };
let currentPanel = 'diet';
let editingEntryId = null;
let editingEntryDate = null;

function getCurrentDate() { return currentDate[currentPanel]; }

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Seed-based random for consistent daily content
function seededRandom(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) {
    h = ((h << 5) - h) + seed.charCodeAt(i);
    h |= 0;
  }
  return function() {
    h = (h * 1103515245 + 12345) & 0x7fffffff;
    return h / 0x7fffffff;
  };
}

// ==================== NAVIGATION ====================
document.querySelectorAll('.sidebar-nav a').forEach(link => {
  link.addEventListener('click', function() {
    document.querySelectorAll('.sidebar-nav a').forEach(l => l.classList.remove('active'));
    this.classList.add('active');
    currentPanel = this.dataset.panel;
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + currentPanel).classList.add('active');
    datePicker.value = getCurrentDate();
    document.getElementById('currentDateDisplay').textContent = formatDisplayDate(getCurrentDate());
    renderCurrentPanel();
  });
});

// ==================== DATE ====================
const datePicker = document.getElementById('datePicker');
datePicker.value = getCurrentDate();
document.getElementById('currentDateDisplay').textContent = formatDisplayDate(getCurrentDate());

datePicker.addEventListener('change', function() {
  currentDate[currentPanel] = this.value;
  document.getElementById('currentDateDisplay').textContent = formatDisplayDate(getCurrentDate());
  renderCurrentPanel();
});

document.getElementById('btnToday').addEventListener('click', function() {
  currentDate[currentPanel] = formatDate(new Date());
  datePicker.value = getCurrentDate();
  document.getElementById('currentDateDisplay').textContent = formatDisplayDate(getCurrentDate());
  renderCurrentPanel();
});

function formatDisplayDate(dateStr) {
  const [y,m,d] = dateStr.split('-');
  const weekDays = ['日','一','二','三','四','五','六'];
  const dt = new Date(y, m-1, d);
  return `${y}年${m}月${d}日 星期${weekDays[dt.getDay()]}`;
}

// ==================== DIET DATA ====================
const dietDB = {

  ],
  lunch: [
    { name: '番茄牛肉烩饭', cal: '~520千卡', ing: '牛肉150g、番茄2个、米饭1碗、洋葱半个、番茄酱、盐、黑胡椒', steps: ['牛肉切小块，加生抽和淀粉腌10分钟','番茄去皮切块，洋葱切丝','热油炒洋葱出香，下牛肉炒变色，加番茄炒出汁','加半碗水、番茄酱、盐炖10分钟，浇在饭上'] },
    { name: '西兰花炒虾仁', cal: '~420千卡', ing: '虾仁200g、西兰花1颗、蒜末、盐、料酒、淀粉', steps: ['虾仁加料酒、盐、淀粉抓匀腌5分钟','西兰花焯水1分钟捞出','热油爆香蒜末，下虾仁滑炒至变色','加入西兰花翻炒，加盐调味出锅'] },
    { name: '照烧鸡腿饭', cal: '~550千卡', ing: '鸡腿1只、米饭1碗、生抽、蜂蜜、料酒、姜', steps: ['鸡腿去骨，用生抽、料酒、姜片腌20分钟','调照烧汁：生抽2勺+蜂蜜1勺+料酒1勺+水2勺','鸡皮面朝下煎至金黄，翻面，倒入照烧汁','小火收汁，切片铺在饭上，淋汁'] },

    { name: '宫保鸡丁', cal: '~480千卡', ing: '鸡胸肉200g、花生米30g、黄瓜半根、干辣椒、生抽、醋、糖、淀粉', steps: ['鸡肉切丁加生抽淀粉腌10分钟','调汁：生抽1+醋1+糖1+淀粉水','鸡丁滑油变色捞出，爆香干辣椒，下鸡丁黄瓜丁','倒入料汁翻炒，加花生米出锅'] },

    { name: '冬瓜丸子汤', cal: '~240千卡', ing: '冬瓜300g、猪肉馅100g、姜末、葱花、盐、生抽', steps: ['肉馅加姜末、生抽、盐搅上劲','冬瓜去皮切片','水烧开，用勺子挖肉馅成丸子下锅','丸子浮起后下冬瓜，煮5分钟加盐撒葱花'] },

  ]
};

function generateDiet(dateStr) {
  const rng = seededRandom(dateStr + 'diet');
  const b = dietDB.breakfast[Math.floor(rng() * dietDB.breakfast.length)];
  const l = dietDB.lunch[Math.floor(rng() * dietDB.lunch.length)];
  const d = dietDB.dinner[Math.floor(rng() * dietDB.dinner.length)];
  return { breakfast: b, lunch: l, dinner: d };
}

function renderDiet() {
  const data = generateDiet(getCurrentDate());

function generateSkincare(dateStr) {
  const rng = seededRandom(dateStr + 'skin');
  const tipIndices = [];
  while (tipIndices.length < 3) {
    const idx = Math.floor(rng() * skincareDB.tips.length);
    if (!tipIndices.includes(idx)) tipIndices.push(idx);
  }
  const todayTips = tipIndices.map(i => skincareDB.tips[i]);
  return { morning: skincareDB.morning, evening: skincareDB.evening, tips: todayTips };
}

const WORKOUT_PRESETS = [
  { name:'HIIT燃脂', meta:'30分钟 · 全身', cal:280 },
  { name:'核心训练', meta:'3组循环', cal:150 },
  { name:'深蹲', meta:'15次 × 4组', cal:120 },

  { name:'跳绳', meta:'500个', cal:200 },
  { name:'开合跳', meta:'100个', cal:100 },

  { name:'俯卧撑', meta:'12次 × 3组', cal:110 },
  { name:'卷腹', meta:'20次 × 3组', cal:100 },
];

function loadWorkouts() {
  try { return JSON.parse(localStorage.getItem(WORKOUT_KEY)) || {}; } catch(e) { return {}; }
}
function saveWorkouts(data) { localStorage.setItem(WORKOUT_KEY, JSON.stringify(data)); }
function getWorkout(dateStr) {
  const all = loadWorkouts();
  return all[dateStr] || { items: [] };
}
function setWorkout(dateStr, data) {
  const all = loadWorkouts();
  all[dateStr] = data;
  saveWorkouts(all);
}

function renderWorkout() {
  seedDefaultWorkout(getCurrentDate());
  const dateStr = getCurrentDate();
  const data = getWorkout(dateStr);
  const totalCal = data.items.reduce((sum, it) => sum + (it.checked ? (it.cal || 0) : 0), 0);
  const plannedCal = data.items.reduce((sum, it) => sum + (it.cal || 0), 0);
  const doneCount = data.items.filter(it => it.checked).length;
  const isRest = data.items.length === 0;
  const progressPct = plannedCal > 0 ? Math.round(totalCal / plannedCal * 100) : 0;

  // Calorie summary card — horizontal layout with inline styles
  const cardStyle = 'display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border-radius:20px;padding:18px 24px;box-shadow:0 2px 16px rgba(0,0,0,0.05);margin-bottom:18px;';

  const badgeStyle = 'background:#fef5f7;color:#d4687c;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;';

  document.getElementById('workoutCalCard').innerHTML = isRest ? `
    <div style="${cardStyle}">
      <div style="${blockStyle}">
        <div style="${labelStyle}">今日训练</div>
        <div style="font-size:22px;font-weight:800;color:#d4687c;line-height:1.1;">休息日 ♨️</div>
      </div>
      <div style="flex:1;"></div>
      <div style="background:#fff;color:#c4a0ae;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;">REST DAY</div>
    </div>
  ` : `
    <div style="${cardStyle}">
      <div style="${blockStyle}">
        <div style="${labelStyle}">预计消耗</div>
        <div style="${valueStyle}">${plannedCal}<span style="font-size:14px;font-weight:500;color:#c4a0ae;margin-left:2px;">千卡</span></div>
      </div>
      <div style="${dividerStyle}"></div>
      <div style="${progressStyle}">
        <div style="${progressTextStyle}">已完成 ${totalCal} 千卡 · ${doneCount}/${data.items.length} 项打卡</div>
        <div style="${barBgStyle}"><div style="${barFillStyle};width:${progressPct}%;"></div></div>
      </div>
      <div style="${badgeStyle}">${totalCal >= plannedCal * 0.8 ? '目标达成 ✨' : '继续加油 💪'}</div>
    </div>
  `;

  // Daily training list
  let html = `<div class="workout-day-card">`;
  html += `<div class="workout-day-header">
    <h3>📝 当日训练清单</h3>
    <div class="day-status ${doneCount === data.items.length && data.items.length > 0 ? 'done' : ''}">${isRest ? '休息日' : `${doneCount}/${data.items.length} 完成`}</div>
  </div>`;

  if (isRest) {
    html += `<div class="rest-placeholder">🌙 今天是休息日，给身体放个假吧～<br>点击下方按钮可以添加训练哦</div>`;
  } else {
    html += data.items.map((it, i) => `
      <div class="ex-item">
        <input type="checkbox" ${it.checked ? 'checked' : ''} data-idx="${i}">
        <div class="ex-info ${it.checked ? 'done' : ''}">
          <div class="ex-name">${it.name}</div>
          <div class="ex-meta">${it.meta || ''}</div>
        </div>
        <div class="ex-cal">🔥 ${it.cal || 0}千卡</div>
        <button class="btn-del-ex" data-idx="${i}">×</button>
      </div>
    `).join('');
  }

  html += `
    <div class="day-actions">
      <button class="primary" onclick="showAddForm('daily')">+ 添加训练</button>
      ${!isRest ? `<button onclick="clearWorkoutDay(getCurrentDate())">清空当天</button>` : ''}
    </div>
    <div class="add-ex-form" id="addForm-daily">
      <input type="text" id="exName-daily" placeholder="训练名称，如：跳绳">
      <div class="form-row">
        <input type="text" id="exMeta-daily" placeholder="量，如：500个 / 30分钟">
        <input type="number" id="exCal-daily" placeholder="消耗千卡">
      </div>
      <div class="form-actions">
        <button class="btn-confirm" onclick="addWorkoutItem('daily')">确认添加</button>
        <button class="btn-cancel" onclick="hideAddForm('daily')">取消</button>
      </div>
    </div>
  </div>`;

  html += `<div class="card" style="margin-top:18px;font-size:13px;line-height:1.8;color:var(--text-light);">
    💡 切换顶部日期可查看任意一天的训练安排；不设置训练即为休息日；勾选后顶部卡路里会实时更新。
  </div>`;

  document.getElementById('workoutContent').innerHTML = html;

  // Bind checkbox events
  document.querySelectorAll('.ex-item input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', function() {
      const idx = parseInt(this.dataset.idx);
      const data = getWorkout(dateStr);
      data.items[idx].checked = this.checked;
      setWorkout(dateStr, data);
      renderWorkout();
    });
  });

  // Bind delete events
  document.querySelectorAll('.btn-del-ex').forEach(btn => {
    btn.addEventListener('click', function() {
      const idx = parseInt(this.dataset.idx);
      const data = getWorkout(dateStr);
      data.items.splice(idx, 1);
      setWorkout(dateStr, data);
      renderWorkout();
    });
  });
}

function showAddForm(key) {
  document.getElementById('addForm-' + key).classList.add('active');
}
function hideAddForm(key) {
  document.getElementById('addForm-' + key).classList.remove('active');
}
function addWorkoutItem(key) {
  const dateStr = getCurrentDate();
  const name = document.getElementById('exName-' + key).value.trim();
  const meta = document.getElementById('exMeta-' + key).value.trim();
  const cal = parseInt(document.getElementById('exCal-' + key).value) || 0;
  if (!name) return alert('请输入训练名称');
  const data = getWorkout(dateStr);
  data.items.push({ name, meta, cal, checked: false });
  setWorkout(dateStr, data);
  renderWorkout();
}
function clearWorkoutDay(dateStr) {
  if (!confirm('确定清空这一天的训练安排吗？')) return;
  setWorkout(dateStr, { items: [] });
  renderWorkout();
}

// Seed a default plan for today if empty (one-time hint)
function seedDefaultWorkout(dateStr) {
  const all = loadWorkouts();
  if (all[dateStr] || Object.keys(all).length > 0) return;
  const rng = seededRandom(dateStr + 'workseed');
  const shuffled = [...WORKOUT_PRESETS].sort(() => rng() - 0.5);
  all[dateStr] = { items: shuffled.slice(0, 3).map(it => ({ ...it, checked: false })) };
  saveWorkouts(all);
}

      <div class="stat-label">${s.label}</div>
      <div class="stat-value">${s.val} <span class="stat-unit">${s.unit}</span></div>
    </div>
  `).join('');

  // History
  const historyContainer = document.getElementById('statHistory');
  const sortedDates = Object.keys(bodyAll).sort().reverse();
  if (sortedDates.length > 0) {
    historyContainer.style.display = 'block';
    document.getElementById('statHistoryList').innerHTML = sortedDates.slice(0, 10).map(date => {
      const b = bodyAll[date];
      const parts = [];
      if (b.weight) parts.push(`⚖️${b.weight}kg`);
      if (b.bodyFat) parts.push(`💧${b.bodyFat}%`);
      if (b.bust) parts.push(`👚${b.bust}`);
      if (b.waist) parts.push(`🩱${b.waist}`);
      if (b.hip) parts.push(`👖${b.hip}`);
      return `<div class="stat-record">
        <span class="record-date">📅 ${date}</span>
        <span class="record-values">${parts.join('  ') || '仅身高'}</span>
      </div>`;
    }).join('');
  } else {
    historyContainer.style.display = 'none';
  }
}

// ==================== FINANCE ENGINE ====================
const FINANCE_KEY = 'life_finance_data';
function loadFinances() {
  try { return JSON.parse(localStorage.getItem(FINANCE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveFinances(data) {
  localStorage.setItem(FINANCE_KEY, JSON.stringify(data));
}

function getEntries(dateStr) {
  const all = loadFinances();
  return all[dateStr] || [];
}
function setEntries(dateStr, entries) {
  const all = loadFinances();
  all[dateStr] = entries;
  saveFinances(all);
}

function getMonthFinances(dateStr) {
  const [y, m] = dateStr.split('-');
  const prefix = `${y}-${m}-`;
  const all = loadFinances();
  let totalIncome = 0, totalExpense = 0;
  Object.keys(all).forEach(date => {
    if (date.startsWith(prefix)) {
      all[date].forEach(e => {
        if (e.type === 'income') totalIncome += e.amount;
        else totalExpense += e.amount;
      });
    }
  });
  return { income: totalIncome, expense: totalExpense, balance: totalIncome - totalExpense };
}

function renderFinance() {
  const entries = getEntries(getCurrentDate());
  const monthFin = getMonthFinances(getCurrentDate());

  // Daily stats
  let dailyIncome = 0, dailyExpense = 0;
  entries.forEach(e => {
    if (e.type === 'income') dailyIncome += e.amount;
    else dailyExpense += e.amount;
  });

  // Summary
  document.getElementById('finSummary').innerHTML = `
    <div class="fin-sum-card">
      <div class="fin-label">📅 今日收入</div>
      <div class="fin-value" style="color:var(--income)">¥${dailyIncome.toFixed(2)}</div>
    </div>
    <div class="fin-sum-card">
      <div class="fin-label">📅 今日支出</div>
      <div class="fin-value" style="color:var(--expense)">¥${dailyExpense.toFixed(2)}</div>
    </div>
    <div class="fin-sum-card">
      <div class="fin-label">📊 本月收入</div>
      <div class="fin-value" style="color:var(--income)">¥${monthFin.income.toFixed(2)}</div>
    </div>
    <div class="fin-sum-card">
      <div class="fin-label">📊 本月支出</div>
      <div class="fin-value" style="color:var(--expense)">¥${monthFin.expense.toFixed(2)}</div>
    </div>
    <div class="fin-sum-card">
      <div class="fin-label">💰 本月结余</div>
      <div class="fin-value" style="color:${monthFin.balance >= 0 ? 'var(--income)' : 'var(--expense)'}">¥${monthFin.balance.toFixed(2)}</div>
    </div>
    <div class="fin-sum-card">
      <div class="fin-label">📋 本月总笔数</div>
      <div class="fin-value" style="color:var(--text)">${Object.keys(loadFinances()).filter(d => d.startsWith(getCurrentDate().substring(0,7))).reduce((sum,d) => sum + (loadFinances()[d]||[]).length, 0)}</div>
    </div>
  `;

  // Entries list
  let listHtml = '';
  if (entries.length === 0) {
    listHtml = `<div class="empty-state">
      <div class="empty-emoji">📝</div>
      <div>今天还没有记账哦，开始记录吧～</div>
    </div>`;
  } else {
    entries.forEach((e, idx) => {
      const sign = e.type === 'income' ? '+' : '-';
      listHtml += `<div class="fin-entry ${e.type}">
        <div class="entry-cat">${e.category.split(' ')[0]}</div>
        <div class="entry-info">
          <div class="entry-name">${e.category}</div>
          ${e.note ? `<div class="entry-note">${e.note}</div>` : ''}
        </div>
        <div class="entry-amount">${sign}¥${e.amount.toFixed(2)}</div>
        <div class="entry-actions">
          <button class="btn-edit" data-idx="${idx}" title="编辑">✏️</button>
          <button class="btn-del" data-idx="${idx}" title="删除">🗑️</button>
        </div>
      </div>`;
    });
  }
  document.getElementById('finEntriesList').innerHTML = listHtml;

  // Bind edit/delete
  document.querySelectorAll('.btn-edit').forEach(btn => {
    btn.addEventListener('click', function() {
      const idx = parseInt(this.dataset.idx);
      openEditModal(getCurrentDate(), idx);
    });
  });
  document.querySelectorAll('.btn-del').forEach(btn => {
    btn.addEventListener('click', function() {
      const idx = parseInt(this.dataset.idx);
      if (confirm('确定删除这笔记录吗？')) {
        const entries = getEntries(getCurrentDate());
        entries.splice(idx, 1);
        setEntries(getCurrentDate(), entries);
        renderFinance();
      }
    });
  });
}

// Add entry
document.getElementById('btnAddFin').addEventListener('click', function() {
  const type = document.getElementById('finType').value;
  const category = document.getElementById('finCategory').value;
  const amount = parseFloat(document.getElementById('finAmount').value);
  const note = document.getElementById('finNote').value.trim();

  if (!amount || amount <= 0) {
    alert('请输入有效金额');
    return;
  }

  const entries = getEntries(getCurrentDate());
  entries.push({ type, category, amount, note });
  setEntries(getCurrentDate(), entries);
  renderFinance();

  // Clear form
  document.getElementById('finAmount').value = '';
  document.getElementById('finNote').value = '';
});

// Edit modal
function openEditModal(dateStr, idx) {
  editingEntryDate = dateStr;
  editingEntryId = idx;
  const entries = getEntries(dateStr);
  const entry = entries[idx];

  document.getElementById('editType').innerHTML = `
    <option value="expense" ${entry.type==='expense'?'selected':''}>🔴 支出</option>
    <option value="income" ${entry.type==='income'?'selected':''}>🟢 收入</option>
  `;
  const cats = ['🍜 餐饮','🚇 交通','🛒 购物','🏠 居住','🎮 娱乐','💊 医疗','📚 教育','💼 工资','📈 理财','🎁 红包','📋 其他'];
  document.getElementById('editCategory').innerHTML = cats.map(c => `<option value="${c}" ${entry.category===c?'selected':''}>${c}</option>`).join('');
  document.getElementById('editAmount').value = entry.amount;
  document.getElementById('editNote').value = entry.note || '';
  document.getElementById('editModal').style.display = 'flex';
}

document.getElementById('btnCancelEdit').addEventListener('click', function() {

  editingEntryId = null;
  editingEntryDate = null;
});

    note: document.getElementById('editNote').value.trim(),
  };
  setEntries(editingEntryDate, entries);
  document.getElementById('editModal').style.display = 'none';
  renderFinance();
});
